name: Build APK Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ads_mode:
        description: >-
          Modalita' annunci. production = ID reali (default, obbligatoria per
          lo store). test-demo = ID demo Google, sempre attivi anche con AdMob
          "In preparazione", verificano solo SDK e UI. test-device = ID reali
          con dispositivo registrato come tester, unico modo di provare la SSV.
        type: choice
        required: false
        default: production
        options:
          - production
          - test-demo
          - test-device
      ads_test_device_id:
        description: >-
          Solo per test-device: ID dispositivo da AdMob. Lo stampa l'SDK al
          primo caricamento (adb logcat | grep setTestDeviceIds). Piu' di uno
          separati da virgola.
        type: string
        required: false
        default: ''

jobs:
  apk-debug:
    name: APK — installabile su Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: appver
        run: |
          VERSION_NAME=$(node -p "require('./app.json').expo.version")
          VERSION_CODE=$(node -p "require('./app.json').expo.android.versionCode")
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Version $VERSION_NAME (versionCode $VERSION_CODE)"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Create .env for build
        id: adsmode
        run: |
          ADS_MODE="${{ inputs.ads_mode }}"
          # Un push su main non passa inputs: si ricade su production, cioe'
          # sugli ID reali. Spedire per sbaglio gli ID demo non genera revenue
          # e puo' violare le policy, quindi il default sbaglia dalla parte
          # sicura.
          ADS_MODE="${ADS_MODE:-production}"

          {
            echo "EXPO_PUBLIC_REVENUECAT_API_KEY=${{ secrets.REVENUECAT_API_KEY }}"
            echo "EXPO_PUBLIC_ADS_MODE=$ADS_MODE"
            echo "EXPO_PUBLIC_ADS_TEST_DEVICE_ID=${{ inputs.ads_test_device_id }}"
          } > .env

          echo "mode=$ADS_MODE" >> $GITHUB_OUTPUT
          echo "ADS_MODE=$ADS_MODE"
          if [ "$ADS_MODE" != "production" ]; then
            echo "::warning title=Build non di produzione::Questa build usa ADS_MODE=$ADS_MODE. NON caricarla sullo store."
          fi

      - name: Expo prebuild (genera cartella android/)
        run: npx expo prebuild --platform android --no-install --clean

      # Il keystore va decodificato DOPO il prebuild: '--clean' cancella e
      # rigenera android/, quindi un keystore scritto prima sparisce e la
      # firma di release ricade sul debug.keystore.
      - name: Decode release keystore from secret (with size assertion + chmod 600)
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          ls -la android/app/release.keystore
          if [ ! -s android/app/release.keystore ]; then
            echo "❌ Keystore file is empty — ANDROID_KEYSTORE_BASE64 secret missing or malformed"
            exit 1
          fi
          chmod 600 android/app/release.keystore
          echo "✅ Keystore decoded and secured (mode 600)"

      - name: Patch build.gradle (signing di release + bundle JS embedded)
        run: python3 scripts/patch_build_gradle.py
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Inject Gradle init script to block Sonatype snapshots
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/remove-sonatype-snapshots.gradle <<'INITSCRIPT'
          allprojects {
              beforeEvaluate { project ->
                  project.repositories.all { repo ->
                      if (repo instanceof MavenArtifactRepository && repo.url.toString().contains('oss.sonatype.org')) {
                          project.repositories.remove repo
                      }
                  }
                  project.buildscript.repositories.all { repo ->
                      if (repo instanceof MavenArtifactRepository && repo.url.toString().contains('oss.sonatype.org')) {
                          project.buildscript.repositories.remove repo
                      }
                  }
              }
              afterEvaluate { project ->
                  project.repositories.removeIf { repo ->
                      repo instanceof MavenArtifactRepository && repo.url.toString().contains('oss.sonatype.org')
                  }
                  project.buildscript.repositories.removeIf { repo ->
                      repo instanceof MavenArtifactRepository && repo.url.toString().contains('oss.sonatype.org')
                  }
              }
          }
          settingsEvaluated { settings ->
              settings.dependencyResolutionManagement.repositories.removeIf { repo ->
                  repo instanceof MavenArtifactRepository && repo.url.toString().contains('oss.sonatype.org')
              }
          }
          INITSCRIPT

      # Stessi flag del workflow AAB: R8 in full mode ha gia' fatto sparire
      # MainActivity in passato, e qui serve un APK che si installi, non uno
      # ottimizzato al massimo.
      - name: Disable shrinkResources and R8 full mode for faster build
        run: |
          echo "android.enableShrinkResourcesInReleaseBuilds=false" >> android/gradle.properties
          echo "android.enableR8.fullMode=false" >> android/gradle.properties
          # expo prebuild rigenera gradle.properties col default Expo
          # (-Xmx2048m), che manda in OutOfMemoryError
          # ':app:collectReleaseDependencies'. L'ultima occorrenza vince.
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -Dfile.encoding=UTF-8" >> android/gradle.properties
          grep -E 'enableShrinkResources|enableR8|jvmargs' android/gradle.properties

      - name: Build APK Release
        # Le variabili del keystore servono a Gradle in fase di build, non solo
        # alla patch: build.gradle le legge con System.getenv().
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -Dfile.encoding=UTF-8"
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GRADLE_OPTS: "-Xmx6g -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:MaxMetaspaceSize=1g"

      - name: Locate APK
        if: always()
        run: find android -name "*.apk" 2>/dev/null || echo "APK non trovato"

      # Un APK firmato debug e' indistinguibile a occhio da uno di release, ma
      # Google Play Billing lo rifiuta: meglio far fallire qui la build che
      # scoprirlo sul telefono.
      - name: Verify APK is release-signed (not debug)
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" | tee /tmp/certs.txt
          if grep -q "CN=Android Debug" /tmp/certs.txt; then
            echo "❌ APK firmato col keystore di debug — Google Play Billing lo rifiutera'"
            exit 1
          fi
          echo "✅ APK firmato con il keystore di release"

      - name: Upload APK Release
        uses: actions/upload-artifact@v4
        with:
          name: MiloOffice-v${{ steps.appver.outputs.name }}-APK-release-signed-ads_${{ steps.adsmode.outputs.mode }}-${{ github.sha }}
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
