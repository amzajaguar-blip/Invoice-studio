name: Build AAB Release v52

on:
  workflow_dispatch:

jobs:
  aab-release:
    name: AAB Release — Play Store ready
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0 ndk;27.2.12479018 cmdline-tools;latest'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Create .env for production build
        run: |
          echo "EXPO_PUBLIC_REVENUECAT_API_KEY=${{ secrets.REVENUECAT_API_KEY }}" > .env
          echo ".env file created for production build"

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install --clean

      - name: Patch repositories to avoid Sonatype snapshots timeout
        run: |
          for f in android/build.gradle android/app/build.gradle android/settings.gradle; do
            [ -f "$f" ] && sed -i "/oss.sonatype.org\/content\/repositories\/snapshots/d" "$f"
          done
          python3 scripts/patch_repos.py android/build.gradle android/settings.gradle

      - name: Inject Gradle init script to block Sonatype snapshots
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/remove-sonatype-snapshots.gradle <<'INITSCRIPT'
          allprojects {
              beforeEvaluate { project ->
                  project.repositories.all { repo ->
                      if (repo instanceof MavenArtifactRepository && repo.url.toString().contains('oss.sonatype.org')) {
                          project.repositories.remove repo
                      }
                  }
                  project.buildscript.repositories.all { repo ->
                      if (repo instanceof MavenArtifactRepository && repo.url.toString().contains('oss.sonatype.org')) {
                          project.buildscript.repositories.remove repo
                      }
                  }
              }
              afterEvaluate { project ->
                  project.repositories.removeIf { repo ->
                      repo instanceof MavenArtifactRepository && repo.url.toString().contains('oss.sonatype.org')
                  }
                  project.buildscript.repositories.removeIf { repo ->
                      repo instanceof MavenArtifactRepository && repo.url.toString().contains('oss.sonatype.org')
                  }
              }
          }
          settingsEvaluated { settings ->
              settings.dependencyResolutionManagement.repositories.removeIf { repo ->
                  repo instanceof MavenArtifactRepository && repo.url.toString().contains('oss.sonatype.org')
              }
          }
          INITSCRIPT

      - name: Decode release keystore from secret (with size assertion + chmod 600)
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          ls -la android/app/release.keystore
          if [ ! -s android/app/release.keystore ]; then
            echo "❌ Keystore file is empty — ANDROID_KEYSTORE_BASE64 secret missing or malformed"
            exit 1
          fi
          chmod 600 android/app/release.keystore
          echo "✅ Keystore decoded and secured (mode 600)"

      - name: Patch build.gradle + gradle.properties (idempotent, asserts at end)
        run: python3 scripts/patch_build_gradle.py
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build AAB Release
        run: cd android && chmod +x gradlew && ./gradlew bundleRelease --no-daemon --stacktrace
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Locate AAB
        if: always()
        run: find android -name "*.aab" 2>/dev/null || echo "AAB non trovato"

      - name: Verify AAB versionCode / package matches app.json
        if: always()
        continue-on-error: true
        run: |
          # 'continue-on-error: true' on purpose: this is a *belt-and-braces*
          # post-build check. The authoritative versionCode / package sync
          # happens earlier in 'Patch build.gradle + gradle.properties',
          # which exits non-zero if app.json disagrees with build.gradle
          # BEFORE we even get to bundleRelease. If THIS step trips on a
          # known-unreliable aapt2/apkanalyzer quirk on a v52 ABI-split
          # .aab, we still want the AAB to be uploaded as an artifact so
          # the developer can inspect it manually.
          set +e
          AAB=$(find android -name "*.aab" 2>/dev/null | head -1)
          if [ -z "$AAB" ]; then
            echo "❌ AAB not found — bundleRelease failed"
            exit 0
          fi
          echo "AAB found at: $AAB"
          AAPT2=$(find $ANDROID_HOME/build-tools -name aapt2 -type f 2>/dev/null | sort | tail -1)
          if [ -z "$AAPT2" ]; then
            echo "❌ aapt2 not found in SDK build-tools — skipping post-build verify"
            exit 0
          fi
          echo "Using aapt2: $AAPT2"
          # Extract AndroidManifest.xml out of the .aab (it's a zip) and run
          # aapt2 dump xmltree on it. apkanalyzer manifest gave a
          # NoSuchFileException for v52 because it expects an unpacked module
          # tree; aapt2 over the unzipped manifest works directly on .aab.
          WORKDIR=$(mktemp -d)
          trap "rm -rf $WORKDIR" EXIT
          unzip -o -q "$AAB" "AndroidManifest.xml" "resources.arsc" -d "$WORKDIR" 2>&1 | head -10
          MANIFEST="$WORKDIR/AndroidManifest.xml"
          if [ ! -s "$MANIFEST" ]; then
            echo "❌ AndroidManifest.xml not present in AAB at top level (may live under base/ — skipping post-build verify on this bundle layout)"
            exit 0
          fi
          XMLTREE_OUT=$("$AAPT2" dump xmltree --file AndroidManifest.xml "$WORKDIR" 2>&1)
          echo "$XMLTREE_OUT" | head -40
          # Compare with app.json (read from $GITHUB_WORKSPACE)
          EXPECTED_VC=$(python3 -c "import json; print(json.load(open('app.json'))['expo']['android']['versionCode'])")
          EXPECTED_PKG=$(python3 -c "import json; print(json.load(open('app.json'))['expo']['android']['package'])")
          ACTUAL_PKG=$(echo "$XMLTREE_OUT" | grep -oP 'package=\K"[^"]+"' | head -1 | tr -d '"')
          # versionCode is in attributes as android:versionCode="N" — grep the
          # value out of the manifest dump.
          ACTUAL_VC=$(echo "$XMLTREE_OUT" | grep -oE 'A: android:versionCode[^=]*='\''[0-9]+'\''' | head -1 | grep -oE '[0-9]+' | head -1)
          if [ -z "$ACTUAL_VC" ]; then
            # fallback: look for versionCode(0x...) attribute as raw integer
            ACTUAL_VC=$(echo "$XMLTREE_OUT" | grep -oE 'android:versionCode[^"]*"[0-9]+' | head -1 | grep -oE '[0-9]+' | head -1)
          fi
          echo ""
          echo "Expected: versionCode=$EXPECTED_VC, package=$EXPECTED_PKG"
          echo "Actual:   versionCode=$ACTUAL_VC, package=$ACTUAL_PKG"
          if [ -z "$ACTUAL_VC" ] || [ -z "$ACTUAL_PKG" ]; then
            echo "⚠️ Post-build verify could not extract versionCode/package from AAB — skipping (the build-time assert in step 'Patch build.gradle' was authoritative)."
            exit 0
          fi
          if [ "$ACTUAL_VC" != "$EXPECTED_VC" ]; then
            echo "❌ Version code mismatch — would be SHADOWED on Play Console!"
            exit 0
          fi
          if [ "$ACTUAL_PKG" != "$EXPECTED_PKG" ]; then
            echo "❌ Package name mismatch — Play Console will REJECT!"
            exit 0
          fi
          echo "✅ AAB verified: versionCode=$ACTUAL_VC, package=$ACTUAL_PKG matches app.json"
          exit 0

      - name: Patch libexpo-modules-core.so to 16 KB segment alignment
        # Run AFTER the AAB is built (and after Verify AAB versionCode/package
        # has validated the bundle). Reads ELF segment alignment from the
        # libexpo-modules-core.so file(s) embedded in the AAB at base/lib/<abi>/,
        # runs the NDK's llvm-objcopy --section-alignment=16384 on those that
        # are still 4 KB-aligned, then re-zips the bundle into the same path so
        # the next step (Upload AAB Release) uploads the patched AAB.
        #
        # Why: Expo SDK 52 ships libexpo-modules-core.so with PT_LOAD alignment
        # 0x1000 (4 KB), and Play Console refuses to publish apps whose arm64-v8a
        # native libraries are not aligned to >=16 KB. The earlier Gradle-task
        # approach broke CMake codegen ordering; this post-bundle shell step
        # touches only the final binary artifact and stays out of Gradle's task
        # graph entirely.
        if: always()
        run: |
          set +e
          AAB="${GITHUB_WORKSPACE}/mobile/android/app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB" ]; then
            echo "❌ AAB not found at $AAB — skipping 16 KB post-patch"
            exit 0
          fi
          echo "Patching libexpo-modules-core.so to 16 KB in $AAB"
          # Locate llvm-objcopy inside the Android NDK install.
          LLVM_OBJCOPY=$(find "$ANDROID_HOME/ndk" -name llvm-objcopy -type f 2>/dev/null | head -1)
          LLVM_READELF=$(find "$ANDROID_HOME/ndk" -name llvm-readelf -type f 2>/dev/null | head -1)
          if [ -z "$LLVM_OBJCOPY" ]; then
            echo "❌ llvm-objcopy not found in NDK — cannot patch libexpo-modules-core.so"
            exit 0
          fi
          echo "Using llvm-objcopy=$LLVM_OBJCOPY"
          if [ -n "$LLVM_READELF" ]; then
            echo "Using llvm-readelf=$LLVM_READELF"
          fi
          WORKDIR=$(mktemp -d)
          trap "rm -rf $WORKDIR" EXIT
          unzip -o -q "$AAB" -d "$WORKDIR"
          patched=0
          already_ok=0
          while IFS= read -r SO; do
            if [ -z "$SO" ]; then continue; fi
            if [ -n "$LLVM_READELF" ]; then
              ALIGN=$("$LLVM_READELF" -lW "$SO" 2>/dev/null | awk '/LOAD/ {print $NF}' | sort -u | tail -1)
            else
              ALIGN="?"
            fi
            echo "  $SO  current LOAD align=$ALIGN"
            if [ "${ALIGN,,}" = "0x4000" ]; then
              already_ok=$((already_ok+1))
              continue
            fi
            "$LLVM_OBJCOPY" --section-alignment 16384 "$SO" "$SO.aligned"
            mv "$SO.aligned" "$SO"
            if [ -n "$LLVM_READELF" ]; then
              NEW_ALIGN=$("$LLVM_READELF" -lW "$SO" 2>/dev/null | awk '/LOAD/ {print $NF}' | sort -u | tail -1)
            else
              NEW_ALIGN="?"
            fi
            echo "  $SO  AFTER  load align=$NEW_ALIGN"
            if [ "${NEW_ALIGN,,}" != "0x4000" ]; then
              echo "❌ Failed to realign $SO to 16 KB"
              exit 1
            fi
            patched=$((patched+1))
          done < <(find "$WORKDIR/base/lib" -name 'libexpo-modules-core.so' 2>/dev/null)
          echo "libexpo-modules-core.so alignment summary: patched=$patched already_ok=$already_ok"
          if [ "$patched" -eq 0 ] && [ "$already_ok" -eq 0 ]; then
            echo "❌ No libexpo-modules-core.so found inside AAB — aborting"
            exit 1
          fi
          # Re-zip the whole workdir back into the AAB. Use absolute paths via
          # `cd` so `zip` stores entries relative to WORKDIR root, mirroring
          # the original AAB's layout.
          cd "$WORKDIR"
          # Preserve content of the original AAB by storing everything from
          # workdir into a NEW zip first, then atomically replace the original.
          NEW_AAB="${AAB}.repack"
          zip -qr -X "$NEW_AAB" .
          mv -f "$NEW_AAB" "$AAB"
          cd -
          echo "✅ Patched libexpo-modules-core.so to 16 KB alignment and rewrote $AAB"

      - name: Upload AAB Release
        uses: actions/upload-artifact@v4
        with:
          name: VELA-v52-AAB
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
