name: Build AAB Release

on:
  workflow_dispatch:
    inputs:
      ads_mode:
        description: >-
          Modalita' annunci. production = ID reali (default, obbligatoria per
          lo store). test-demo = ID demo Google, sempre attivi anche con AdMob
          "In preparazione", verificano solo SDK e UI. test-device = ID reali
          con dispositivo registrato come tester, unico modo di provare la SSV.
        type: choice
        required: false
        default: production
        options:
          - production
          - test-demo
          - test-device
      ads_test_device_id:
        description: >-
          Solo per test-device: ID dispositivo da AdMob. Lo stampa l'SDK al
          primo caricamento (adb logcat | grep setTestDeviceIds). Piu' di uno
          separati da virgola.
        type: string
        required: false
        default: ''
      ads_diag:
        description: >-
          Diagnostica annunci a schermo: al posto dello spazio vuoto mostra il
          codice d'errore dell'SDK AdMob, che e' l'unica cosa che distingue
          "nessun annuncio disponibile" (NO_FILL) da "ad unit ID rifiutato"
          (INVALID_REQUEST). Default false: su una build per utenti veri non
          va acceso.
        type: boolean
        required: false
        default: false
      billing_diag:
        description: >-
          Diagnostica del paywall a schermo e log RevenueCat VERBOSE. Default
          false: questo artifact finisce sullo store. Va messo a true solo per
          un AAB da caricare sul canale di test interno, che e' l'unico modo
          di leggere la risposta di Google Play Billing su un'app installata
          da Play. Un AAB con true NON va promosso in produzione.
        type: boolean
        required: false
        default: false

jobs:
  aab-release:
    name: AAB Release — Play Store ready
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: appver
        run: |
          VERSION_NAME=$(node -p "require('./app.json').expo.version")
          VERSION_CODE=$(node -p "require('./app.json').expo.android.versionCode")
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Version $VERSION_NAME (versionCode $VERSION_CODE)"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 cmdline-tools;latest'

      # Senza questa cache ogni run riscarica gradle-8.13-bin.zip e l'intera
      # cache delle dipendenze. Non e' solo tempo: il download del wrapper e'
      # gia' fallito con "java.net.SocketException: Unexpected end of file from
      # server" dentro org.gradle.wrapper.Install.forceFetch, buttando via un
      # ciclo intero per un motivo che col codice non c'entra nulla.
      #
      # La chiave non puo' dipendere dai file Gradle: `android/` non esiste
      # ancora a questo punto, la crea `expo prebuild` piu' sotto. Si usa quindi
      # il lockfile npm, che e' cio' che determina davvero le dipendenze native.
      - name: Cache Gradle (wrapper + dipendenze)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Create .env for build
        id: adsmode
        run: |
          ADS_MODE="${{ inputs.ads_mode }}"
          # Un push su main non passa inputs: si ricade su production, cioe'
          # sugli ID reali. Spedire per sbaglio gli ID demo non genera revenue
          # e puo' violare le policy, quindi il default sbaglia dalla parte
          # sicura.
          ADS_MODE="${ADS_MODE:-production}"

          BILLING_DIAG=0
          SUFFIX=""
          ADS_DIAG=0
          if [ "${{ inputs.ads_diag }}" = "true" ]; then ADS_DIAG=1; fi
          if [ "${{ inputs.billing_diag }}" = "true" ]; then
            BILLING_DIAG=1
            SUFFIX="-BILLINGDIAG-solo-test-interno"
          fi

          {
            echo "EXPO_PUBLIC_REVENUECAT_API_KEY=${{ secrets.REVENUECAT_API_KEY }}"
            echo "EXPO_PUBLIC_ADS_MODE=$ADS_MODE"
            echo "EXPO_PUBLIC_ADS_TEST_DEVICE_ID=${{ inputs.ads_test_device_id }}"
            echo "EXPO_PUBLIC_BILLING_DIAG=$BILLING_DIAG"
            echo "EXPO_PUBLIC_ADS_DIAG=$ADS_DIAG"
          } > .env

          echo "mode=$ADS_MODE" >> $GITHUB_OUTPUT
          # Il suffisso finisce nel nome dell'artifact: un AAB con la
          # diagnostica accesa e uno di produzione sono identici a occhio, e
          # promuovere il primo mostrerebbe contatori di tap a chi paga.
          echo "diagsuffix=$SUFFIX" >> $GITHUB_OUTPUT
          echo "ADS_MODE=$ADS_MODE · BILLING_DIAG=$BILLING_DIAG · ADS_DIAG=$ADS_DIAG"
          if [ "$ADS_MODE" != "production" ]; then
            echo "::warning title=Build non di produzione::Questa build usa ADS_MODE=$ADS_MODE. NON caricarla sullo store."
          fi
          if [ "$BILLING_DIAG" = "1" ]; then
            echo "::warning title=Diagnostica billing accesa::Questo AAB mostra la diagnostica del paywall. Va solo sul canale di test interno, NON in produzione."
          fi

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install --clean

      - name: Patch repositories to avoid Sonatype snapshots timeout
        run: |
          for f in android/build.gradle android/app/build.gradle android/settings.gradle; do
            [ -f "$f" ] && sed -i "/oss.sonatype.org\/content\/repositories\/snapshots/d" "$f"
          done
          python3 scripts/patch_repos.py android/build.gradle android/settings.gradle

      - name: Inject Gradle init script to block Sonatype snapshots
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/remove-sonatype-snapshots.gradle <<'INITSCRIPT'
          allprojects {
              beforeEvaluate { project ->
                  project.repositories.all { repo ->
                      if (repo instanceof MavenArtifactRepository && repo.url.toString().contains('oss.sonatype.org')) {
                          project.repositories.remove repo
                      }
                  }
                  project.buildscript.repositories.all { repo ->
                      if (repo instanceof MavenArtifactRepository && repo.url.toString().contains('oss.sonatype.org')) {
                          project.buildscript.repositories.remove repo
                      }
                  }
              }
              afterEvaluate { project ->
                  project.repositories.removeIf { repo ->
                      repo instanceof MavenArtifactRepository && repo.url.toString().contains('oss.sonatype.org')
                  }
                  project.buildscript.repositories.removeIf { repo ->
                      repo instanceof MavenArtifactRepository && repo.url.toString().contains('oss.sonatype.org')
                  }
              }
          }
          settingsEvaluated { settings ->
              settings.dependencyResolutionManagement.repositories.removeIf { repo ->
                  repo instanceof MavenArtifactRepository && repo.url.toString().contains('oss.sonatype.org')
              }
          }
          INITSCRIPT

      - name: Decode release keystore from secret (with size assertion + chmod 600)
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          ls -la android/app/release.keystore
          if [ ! -s android/app/release.keystore ]; then
            echo "❌ Keystore file is empty — ANDROID_KEYSTORE_BASE64 secret missing or malformed"
            exit 1
          fi
          chmod 600 android/app/release.keystore
          echo "✅ Keystore decoded and secured (mode 600)"

      - name: Patch build.gradle + gradle.properties (idempotent, asserts at end)
        run: python3 scripts/patch_build_gradle.py
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Alza la memoria della JVM Gradle
        run: |
          # Qui venivano appesi anche enableShrinkResourcesInReleaseBuilds=false
          # ed enableR8.fullMode=false, subito DOPO che patch_build_gradle.py li
          # aveva scritti a true e verificati con un assert "count == 1". Il
          # risultato era una chiave doppia — proprio quella che lo script
          # definisce non deterministica per findProperty — e una CI tutta verde
          # su una configurazione diversa da quella costruita. Ora quei due
          # valori li dichiara app.json (expo-build-properties) e lo script li
          # verifica: nessuno li riscrive piu' qui.
          #
          # expo prebuild rigenera gradle.properties col default Expo
          # (-Xmx2048m), che manda in OutOfMemoryError
          # ':app:collectReleaseDependencies'. L'ultima occorrenza vince,
          # quindi questa riga sovrascrive il default.
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -Dfile.encoding=UTF-8" >> android/gradle.properties
          grep -E 'enableShrinkResources|enableR8|useLegacyPackaging|jvmargs' android/gradle.properties

      - name: Build AAB Release
        # -D sulla command line ha la precedenza su gradle.properties: e' la
        # cintura oltre alle bretelle della riga scritta qui sopra. GRADLE_OPTS
        # resta perche' copre la JVM launcher, che con --no-daemon e' un
        # processo distinto da quello che esegue i task.
        run: cd android && chmod +x gradlew && ./gradlew bundleRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -Dfile.encoding=UTF-8"
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GRADLE_OPTS: "-Xmx6g -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:MaxMetaspaceSize=1g"

      - name: Locate AAB
        if: always()
        run: find android -name "*.aab" 2>/dev/null || echo "AAB non trovato"

      - name: Verify AAB versionCode / package matches app.json
        if: always()
        continue-on-error: true
        run: |
          # 'continue-on-error: true' on purpose: this is a *belt-and-braces*
          # post-build check. The authoritative versionCode / package sync
          # happens earlier in 'Patch build.gradle + gradle.properties',
          # which exits non-zero if app.json disagrees with build.gradle
          # BEFORE we even get to bundleRelease. If THIS step trips on a
          # known-unreliable aapt2/apkanalyzer quirk on a v52 ABI-split
          # .aab, we still want the AAB to be uploaded as an artifact so
          # the developer can inspect it manually.
          set +e
          AAB=$(find android -name "*.aab" 2>/dev/null | head -1)
          if [ -z "$AAB" ]; then
            echo "❌ AAB not found — bundleRelease failed"
            exit 0
          fi
          echo "AAB found at: $AAB"
          AAPT2=$(find $ANDROID_HOME/build-tools -name aapt2 -type f 2>/dev/null | sort | tail -1)
          if [ -z "$AAPT2" ]; then
            echo "❌ aapt2 not found in SDK build-tools — skipping post-build verify"
            exit 0
          fi
          echo "Using aapt2: $AAPT2"
          # Extract AndroidManifest.xml out of the .aab (it's a zip) and run
          # aapt2 dump xmltree on it. apkanalyzer manifest gave a
          # NoSuchFileException for v52 because it expects an unpacked module
          # tree; aapt2 over the unzipped manifest works directly on .aab.
          WORKDIR=$(mktemp -d)
          trap "rm -rf $WORKDIR" EXIT
          unzip -o -q "$AAB" "AndroidManifest.xml" "resources.arsc" -d "$WORKDIR" 2>&1 | head -10
          MANIFEST="$WORKDIR/AndroidManifest.xml"
          if [ ! -s "$MANIFEST" ]; then
            echo "❌ AndroidManifest.xml not present in AAB at top level (may live under base/ — skipping post-build verify on this bundle layout)"
            exit 0
          fi
          XMLTREE_OUT=$("$AAPT2" dump xmltree --file AndroidManifest.xml "$WORKDIR" 2>&1)
          echo "$XMLTREE_OUT" | head -40
          # Compare with app.json (read from $GITHUB_WORKSPACE)
          EXPECTED_VC=$(python3 -c "import json; print(json.load(open('app.json'))['expo']['android']['versionCode'])")
          EXPECTED_PKG=$(python3 -c "import json; print(json.load(open('app.json'))['expo']['android']['package'])")
          ACTUAL_PKG=$(echo "$XMLTREE_OUT" | grep -oP 'package=\K"[^"]+"' | head -1 | tr -d '"')
          # versionCode is in attributes as android:versionCode="N" — grep the
          # value out of the manifest dump.
          ACTUAL_VC=$(echo "$XMLTREE_OUT" | grep -oE 'A: android:versionCode[^=]*='\''[0-9]+'\''' | head -1 | grep -oE '[0-9]+' | head -1)
          if [ -z "$ACTUAL_VC" ]; then
            # fallback: look for versionCode(0x...) attribute as raw integer
            ACTUAL_VC=$(echo "$XMLTREE_OUT" | grep -oE 'android:versionCode[^"]*"[0-9]+' | head -1 | grep -oE '[0-9]+' | head -1)
          fi
          echo ""
          echo "Expected: versionCode=$EXPECTED_VC, package=$EXPECTED_PKG"
          echo "Actual:   versionCode=$ACTUAL_VC, package=$ACTUAL_PKG"
          if [ -z "$ACTUAL_VC" ] || [ -z "$ACTUAL_PKG" ]; then
            echo "⚠️ Post-build verify could not extract versionCode/package from AAB — skipping (the build-time assert in step 'Patch build.gradle' was authoritative)."
            exit 0
          fi
          if [ "$ACTUAL_VC" != "$EXPECTED_VC" ]; then
            echo "❌ Version code mismatch — would be SHADOWED on Play Console!"
            exit 0
          fi
          if [ "$ACTUAL_PKG" != "$EXPECTED_PKG" ]; then
            echo "❌ Package name mismatch — Play Console will REJECT!"
            exit 0
          fi
          echo "✅ AAB verified: versionCode=$ACTUAL_VC, package=$ACTUAL_PKG matches app.json"
          exit 0

      - name: Verify R8 did not strip MainActivity / MainApplication
        # CRITICAL GUARD: if R8/ProGuard removes com.Invoice_Studio.myapp.MainActivity
        # (because proguard-rules.pro had the wrong package — historical bug fixed
        # in v62+), the AAB installs but the app crashes immediately on launch with
        # "ClassNotFoundException: MainActivity". Stop the build here with a clear
        # message instead of letting it pass and finding out from a user report.
        if: always()
        run: |
          set +e
          AAB="${GITHUB_WORKSPACE}/mobile/android/app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB" ]; then
            echo "⚠️ AAB not found — skipping MainActivity check"
            exit 0
          fi
          DEXDUMP=/home/locoomo/android-sdk/build-tools/36.0.0/dexdump
          if [ ! -x "$DEXDUMP" ]; then
            DEXDUMP=$(find "$ANDROID_HOME" -name dexdump -type f 2>/dev/null | head -1)
          fi
          if [ -z "$DEXDUMP" ]; then
            echo "⚠️ dexdump not available — skipping MainActivity check"
            exit 0
          fi
          # Find each base/dex/classes*.dex inside the AAB
          WORKDIR=$(mktemp -d)
          trap "rm -rf $WORKDIR" EXIT
          unzip -o -q "$AAB" "base/dex/*" -d "$WORKDIR" 2>&1 | head -3
          HAS_MAIN_ACTIVITY=0
          HAS_MAIN_APPLICATION=0
          for dex in "$WORKDIR"/base/dex/classes*.dex; do
            [ -f "$dex" ] || continue
            DUMP=$("$DEXDUMP" "$dex" 2>/dev/null)
            if echo "$DUMP" | grep -q "Lcom/Invoice_Studio/myapp/MainActivity"; then
              HAS_MAIN_ACTIVITY=1
            fi
            if echo "$DUMP" | grep -q "Lcom/Invoice_Studio/myapp/MainApplication"; then
              HAS_MAIN_APPLICATION=1
            fi
          done
          if [ "$HAS_MAIN_ACTIVITY" -ne 1 ] || [ "$HAS_MAIN_APPLICATION" -ne 1 ]; then
            echo "❌ CRITICAL: R8 stripped launcher classes from .dex"
            echo "   MainActivity in dex:    $HAS_MAIN_ACTIVITY  (need 1)"
            echo "   MainApplication in dex: $HAS_MAIN_APPLICATION  (need 1)"
            echo ""
            echo "   FIX: check mobile/proguard-rules.pro — the keep rules for"
            echo "   MainActivity/MainApplication must match the package declared in"
            echo "   mobile/android/app/build.gradle (namespace + applicationId)."
            echo "   Current package: com.Invoice_Studio.myapp"
            exit 1
          fi
          echo "✅ MainActivity + MainApplication present in .dex (R8 did not strip)"

      - name: Patch libexpo-modules-core.so to 16 KB segment alignment
        # Play Console requires arm64-v8a native libraries to have PT_LOAD
        # alignment >= 16 KB. expo-modules-core@2.5.0 ships
        # libexpo-modules-core.so with p_align=0x1000 (4 KB) on every ABI.
        # This step rewrites p_align to 0x4000 directly in the AAB.
        #
        # Implementation: see mobile/scripts/patch_libexpo_16kb.py.
        # Pure Python (stdlib only), uses zipfile to unzip and rezip in
        # place. ~80 s on the GH Actions runner, ~60-70 MB output
        # (DEFLATE-compressed, close to original size).
        if: always()
        run: |
          set +e
          AAB="${GITHUB_WORKSPACE}/mobile/android/app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB" ]; then
            echo "❌ AAB not found at $AAB — skipping 16 KB post-patch"
            exit 0
          fi
          cd "${GITHUB_WORKSPACE}/mobile"
          python3 scripts/patch_libexpo_16kb.py "$AAB"
          PATCH_EXIT=$?
          if [ "$PATCH_EXIT" -ne 0 ]; then
            echo "❌ 16 KB patch FAILED with exit $PATCH_EXIT — uploading un-patched AAB (will still fail Play Console 16 KB check)"
            exit 0
          fi
          echo "✅ 16 KB post-patch completed"

      - name: Re-sign AAB with v1+v2+v3 (apksigner)
        # The 16 KB post-patch step above re-zips the AAB with Python's
        # zipfile, which destroys Gradle's APK Signature Scheme v2/v3
        # blocks (those live in a separate zip entry after the central
        # directory, so re-zipping leaves only v1 / META-INF/MANIFEST.MF).
        # Play Console rejects v1-only AABs as "Android App Bundle ha una
        # firma non valida". We must re-sign with v2+v3 (and keep v1 for
        # old clients) using apksigner, which understands the .aab format.
        if: always()
        env:
          ANDROID_KEYSTORE_PATH: android/app/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          AAB="${GITHUB_WORKSPACE}/mobile/android/app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB" ]; then
            echo "❌ AAB not found at $AAB — skipping re-sign"
            exit 0
          fi
          APKSIGNER_DIR="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          if [ ! -x "$APKSIGNER_DIR" ]; then
            APKSIGNER_DIR=$(find "$ANDROID_HOME" -name apksigner -type f 2>/dev/null | head -1)
          fi
          echo "Using apksigner: $APKSIGNER_DIR"
          echo "Keystore: $ANDROID_KEYSTORE_PATH (alias=$ANDROID_KEY_ALIAS)"
          # apksigner sign supports .aab directly as of build-tools 30+.
          # v1 + v2 + v3 — same schemes Gradle would have used.
          # apksigner wants to read AndroidManifest.xml at the zip root,
          # but in AABs the manifest lives at base/manifest/AndroidManifest.xml
          # (not at the root, which is APK layout). We use --min-sdk-version
          # to tell apksigner the min SDK and bypass the manifest auto-detect.
          MIN_SDK=$(grep -oP 'minSdkVersion\s+\K\d+' android/app/build.gradle 2>/dev/null || echo "24")
          echo "minSdkVersion: $MIN_SDK"
          # NOTE: --min-sdk-version IS REQUIRED even on build-tools 36.
          # AABs put AndroidManifest.xml at base/manifest/AndroidManifest.xml
          # (not at the zip root, which is APK layout). Without --min-sdk-version
          # apksigner 36 fails with "Missing AndroidManifest.xml" because the
          # auto-detect heuristic still expects the APK layout. The earlier
          # "crash on real device" was caused by the proguard-rules.pro keep
          # rule targeting the wrong package (com.vela.mobile instead of
          # com.Invoice_Studio.myapp), NOT by --min-sdk-version.
          "$APKSIGNER_DIR" sign \
            --ks "$ANDROID_KEYSTORE_PATH" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --min-sdk-version "$MIN_SDK" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            "$AAB"
          echo "✅ AAB re-signed with v1+v2+v3"

      - name: Verify AAB signature (jarsigner)
        # Qui c'era `apksigner verify`, e non ha mai verificato niente.
        #
        # apksigner legge AndroidManifest.xml alla radice dello zip: e' il
        # layout di un APK. In un AAB il manifest sta in
        # base/manifest/AndroidManifest.xml, quindi lo strumento muore con
        # "ApkFormatException: Missing AndroidManifest.xml" — provato anche con
        # --min-sdk-version, che aiuta `sign` ma non `verify`. Il passo pero'
        # apriva con `set +e` e chiudeva con `echo "Verify exit: $?"`, dove $?
        # e' quello dell'echo: l'eccezione veniva inghiottita e la CI segnava
        # verde. Un controllo di firma che non puo' fallire non e' un controllo.
        #
        # Su un bundle la firma che conta e' quella jar (META-INF), ed e' quella
        # che jarsigner sa leggere davvero. Le v2/v3 le rigenera Play App
        # Signing sugli APK che produce lui.
        if: always()
        run: |
          set -euo pipefail
          AAB="${GITHUB_WORKSPACE}/mobile/android/app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB" ]; then
            echo "❌ AAB non trovato in $AAB"
            exit 1
          fi
          echo "Verifico: $AAB"
          # Niente -strict: fa fallire anche su avvisi innocui, come la data di
          # scadenza del certificato.
          if ! jarsigner -verify "$AAB" | grep -q "jar verified."; then
            echo "❌ Firma NON valida — Play rifiuterebbe questo bundle"
            jarsigner -verify -verbose:summary "$AAB" | tail -20
            exit 1
          fi
          echo "✅ jar verified"
          # Il fingerprint rende visibile a colpo d'occhio un keystore sbagliato:
          # una firma valida con la chiave sbagliata e' comunque un rifiuto.
          unzip -p "$AAB" 'META-INF/*.RSA' | keytool -printcert \
            | grep -E "Owner|Proprietario|SHA256" || true

      - name: Upload AAB Release
        uses: actions/upload-artifact@v4
        with:
          name: MiloOffice-v${{ steps.appver.outputs.name }}-AAB-signed-ads_${{ steps.adsmode.outputs.mode }}${{ steps.adsmode.outputs.diagsuffix }}-${{ github.sha }}
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
